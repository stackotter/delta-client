name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macOS-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Force Xcode 16.4
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app
      - name: Version
        run: swift --version
      - name: Test
        run: |
          cd Sources/Core
          swift test
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "5.9"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        run: |
          cd Sources/Core
          swift test
